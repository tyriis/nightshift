openapi: 3.1.0
info:
  title: nightshift
  version: 0.1.0
  description: >-
    Self-hosted task board where humans and AI agents are first-class actors. Plan A surface: tasks, tree/split,
    dependencies, claims with fencing tokens, audit, actor/token/policy administration. Threads/inbox/events arrive
    in later plans.
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: meta
  - name: tasks
  - name: labels
  - name: audit
  - name: admin
  - name: threads
  - name: inbox
  - name: attachments
  - name: links
paths:
  /ping:
    get:
      tags: [meta]
      security: []
      operationId: ping
      responses:
        "200":
          description: liveness
          content:
            application/json:
              schema: { type: object, properties: { pong: { type: string } } }
  /openapi.yaml:
    get:
      tags: [meta]
      security: []
      operationId: getSpec
      responses:
        "200":
          description: This contract
          content:
            application/yaml:
              schema: { type: string }
  /tasks:
    get:
      tags: [tasks]
      operationId: listTasks
      responses:
        "200":
          description: every task with rollup counts
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Task" } }
    post:
      tags: [tasks]
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              additionalProperties: false
              properties:
                title: { type: string, minLength: 1, maxLength: 300 }
                description: { type: string }
                acceptance_criteria: { type: string }
                parent_id: { type: string }
                status: { $ref: "#/components/schemas/TaskStatus" }
                labels: { type: array, items: { type: string, minLength: 1 } }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        default: { $ref: "#/components/responses/Problem" }
  /tasks/next:
    get:
      tags: [tasks]
      operationId: getNextTasks
      parameters:
        - { name: label, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200":
          description: ready leaves (spec §6.3)
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Task" } }
        default: { $ref: "#/components/responses/Problem" }
  /tasks/{id}:
    parameters: [{ $ref: "#/components/parameters/TaskId" }]
    get:
      tags: [tasks]
      operationId: getTask
      responses:
        "200":
          description: task
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      tags: [tasks]
      operationId: patchTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                title: { type: string, minLength: 1, maxLength: 300 }
                description: { type: string }
                acceptance_criteria: { type: string }
                blocked_flag: { type: boolean }
                assignee_id: { type: ["string", "null"] }
      responses:
        "200":
          description: updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        default: { $ref: "#/components/responses/Problem" }
  /tasks/{id}/context:
    parameters: [{ $ref: "#/components/parameters/TaskId" }]
    get:
      tags: [tasks]
      operationId: getTaskContext
      responses:
        "200":
          description: one-call context bundle (spec §7.2) — questions, links and attachments populated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContextBundle" }
        default: { $ref: "#/components/responses/Problem" }
  /tasks/{id}/status:
    parameters: [{ $ref: "#/components/parameters/TaskId" }]
    patch:
      tags: [tasks]
      operationId: changeStatus
      description: requires the current lease_token while the task is claimed (invariant 3)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, reason]
              additionalProperties: false
              properties:
                status: { $ref: "#/components/schemas/TaskStatus" }
                reason: { type: string, minLength: 1 }
                lease_token: { type: string }
      responses:
        "200":
          description: new task state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        default: { $ref: "#/components/responses/Problem" }
  /tasks/{id}/split:
    parameters: [{ $ref: "#/components/parameters/TaskId" }]
    post:
      tags: [tasks]
      operationId: splitTask
      description: atomic; releases any active claim and bumps the fencing generation (spec §6.2)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [children]
              additionalProperties: false
              properties:
                children:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [title]
                    additionalProperties: false
                    properties:
                      title: { type: string, minLength: 1, maxLength: 300 }
                      description: { type: string, description: Markdown (spec §6.1) }
                      acceptance_criteria: { type: string, description: Markdown (spec §6.1) }
                      status: { $ref: "#/components/schemas/TaskStatus" }
      responses:
        "201":
          # ora-20 (documented, not fixed): split passes the SplitTaskResult through un-DTO'd —
          # `parent` is the NESTED {task, child_count, unmet_blockers} shape and `created` items are
          # bare task rows, while the sibling task endpoints above return the flat Task DTO.
          description: children created; see TaskWithCounts for the parent/created shape asymmetry
          content:
            application/json:
              schema:
                type: object
                properties:
                  parent: { $ref: "#/components/schemas/TaskWithCounts" }
                  created: { type: array, items: { $ref: "#/components/schemas/TaskRecord" } }
        default: { $ref: "#/components/responses/Problem" }
  /tasks/{id}/claim:
    parameters: [{ $ref: "#/components/parameters/TaskId" }]
    post:
      tags: [tasks]
      operationId: claimTask
      description: atomic compare-and-swap; 409 already_claimed carries the holder's public identity
      responses:
        "200":
          description: claimed
          content:
            application/json:
              schema:
                type: object
                properties:
                  lease_token: { type: string }
                  generation: { type: integer }
        default: { $ref: "#/components/responses/Problem" }
  /tasks/{id}/release:
    parameters: [{ $ref: "#/components/parameters/TaskId" }]
    post:
      tags: [tasks]
      operationId: releaseTask
      responses:
        "200":
          description: released
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        default: { $ref: "#/components/responses/Problem" }
  /tasks/{id}/heartbeat:
    parameters: [{ $ref: "#/components/parameters/TaskId" }]
    post:
      tags: [tasks]
      operationId: heartbeatTask
      description: liveness record only; keepalive enforcement is deferred (spec §12)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lease_token]
              additionalProperties: false
              properties: { lease_token: { type: string } }
      responses:
        "200":
          description: liveness recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        default: { $ref: "#/components/responses/Problem" }
  /tasks/{id}/blocks/{blockerId}:
    parameters:
      - { $ref: "#/components/parameters/TaskId" }
      - { name: blockerId, in: path, required: true, schema: { type: string } }
    put:
      tags: [tasks]
      operationId: addBlock
      description: blockerId blocks the task; 409 dependency_cycle on cycles
      responses:
        "204": { description: edge present }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      tags: [tasks]
      operationId: removeBlock
      responses:
        "204": { description: edge absent }
        default: { $ref: "#/components/responses/Problem" }
  /tasks/{id}/labels/{labelId}:
    parameters:
      - { $ref: "#/components/parameters/TaskId" }
      - { name: labelId, in: path, required: true, schema: { type: string } }
    put:
      tags: [labels]
      operationId: attachLabel
      responses:
        "204": { description: attached }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      tags: [labels]
      operationId: detachLabel
      responses:
        "204": { description: detached }
        default: { $ref: "#/components/responses/Problem" }
  /labels:
    get:
      tags: [labels]
      operationId: listLabels
      responses:
        "200":
          description: all labels
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Label" } }
    post:
      tags: [labels]
      operationId: createLabel
      description: create-or-get by name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 60 }
                color: { type: string }
      responses:
        "201":
          description: label
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Label" }
        default: { $ref: "#/components/responses/Problem" }
  /audit:
    get:
      tags: [audit]
      operationId: searchAudit
      description: append-only activity log; every authenticated actor may read everything
      parameters:
        - { name: entity_type, in: query, schema: { type: string } }
        - { name: entity_id, in: query, schema: { type: string } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 500, default: 50 },
          }
      responses:
        "200":
          description: newest first
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } }
        default: { $ref: "#/components/responses/Problem" }
  /admin/actors:
    get:
      tags: [admin]
      operationId: listActors
      responses:
        "200":
          description: all actors
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Actor" } }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [admin]
      operationId: createActor
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Actor" }
        default: { $ref: "#/components/responses/Problem" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, handle, display_name]
              additionalProperties: false
              properties:
                kind: { type: string, enum: [human, agent] }
                handle: { type: string, minLength: 1, maxLength: 60 }
                display_name: { type: string, minLength: 1, maxLength: 120 }
                description: { type: string }
  /admin/actors/{id}/tokens:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post:
      tags: [admin]
      operationId: createToken
      description: raw_token shown exactly once; stored SHA-256 only (spec §5)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              additionalProperties: false
              properties: { label: { type: string, minLength: 1, maxLength: 60 } }
      responses:
        "201":
          description: issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  token_id: { type: string }
                  actor_id: { type: string }
                  label: { type: string }
                  created_at: { type: string }
                  raw_token: { type: string }
        default: { $ref: "#/components/responses/Problem" }
  /admin/tokens/{id}/revoke:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post:
      tags: [admin]
      operationId: revokeToken
      responses:
        "204": { description: revoked }
        default: { $ref: "#/components/responses/Problem" }
  /admin/policy/{key}:
    parameters: [{ name: key, in: path, required: true, schema: { type: string } }]
    get:
      tags: [admin]
      operationId: getPolicy
      responses:
        "200":
          description: policy value (allowlisted keys)
          content:
            application/json:
              schema:
                type: object
                properties: { key: { type: string }, value: { type: ["string", "null"] } }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [admin]
      operationId: setPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              additionalProperties: false
              properties: { value: { type: string, enum: ["on", "off"] } }
      responses:
        "200":
          description: stored
          content:
            application/json:
              schema:
                type: object
                properties: { key: { type: string }, value: { type: string } }
        default: { $ref: "#/components/responses/Problem" }
  /tasks/{id}/threads:
    parameters: [{ $ref: "#/components/parameters/TaskId" }]
    get:
      tags: [threads]
      operationId: listThreads
      description: threads oldest-first, each with ordered messages (spec §6.5)
      responses:
        "200":
          description: thread list
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ThreadWithMessages" } }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [threads]
      operationId: createThread
      description: >-
        kind=question requires assignee_handle and opens a review-gating question
        (spec §6.4.6); 409 threads_on_parent on a task with children — humans may
        pass ?meta_note=true (UI-only flag, audited, spec §6.2)
      parameters:
        - { name: meta_note, in: query, schema: { type: boolean } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, body]
              additionalProperties: false
              properties:
                kind: { type: string, enum: [note, question] }
                body: { type: string, minLength: 1, maxLength: 20000 }
                assignee_handle: { type: string, minLength: 1, maxLength: 60 }
      responses:
        "201":
          description: thread with its first message (CreateThreadResult, ports.ts)
          content:
            application/json:
              schema:
                type: object
                properties:
                  thread: { $ref: "#/components/schemas/Thread" }
                  message: { $ref: "#/components/schemas/Message" }
        default: { $ref: "#/components/responses/Problem" }
  /tasks/{id}/threads/{tid}/messages:
    parameters:
      - { $ref: "#/components/parameters/TaskId" }
      - { name: tid, in: path, required: true, schema: { type: string } }
    post:
      tags: [threads]
      operationId: addThreadMessage
      description: reply to a thread; @handles in body route inbox entries (spec §6.5)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              additionalProperties: false
              properties: { body: { type: string, minLength: 1, maxLength: 20000 } }
      responses:
        "201":
          description: appended message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        default: { $ref: "#/components/responses/Problem" }
  /tasks/{id}/threads/{tid}/answer:
    parameters:
      - { $ref: "#/components/parameters/TaskId" }
      - { name: tid, in: path, required: true, schema: { type: string } }
    post:
      tags: [threads]
      operationId: answerQuestionThread
      description: appends the answer message, links it, open → answered (409 question_transition otherwise)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              additionalProperties: false
              properties: { body: { type: string, minLength: 1, maxLength: 20000 } }
      responses:
        "200":
          description: answer + updated thread
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { $ref: "#/components/schemas/Message" }
                  thread: { $ref: "#/components/schemas/Thread" }
        default: { $ref: "#/components/responses/Problem" }
  /tasks/{id}/threads/{tid}:
    parameters:
      - { $ref: "#/components/parameters/TaskId" }
      - { name: tid, in: path, required: true, schema: { type: string } }
    patch:
      tags: [threads]
      operationId: updateQuestionThread
      description: state ∈ {resolved, wont_fix} per D-n transitions; assignee_handle re-assigns (inbox)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                state: { type: string, enum: [open, answered, resolved, wont_fix] }
                assignee_handle: { type: string, minLength: 1, maxLength: 60 }
      responses:
        "200":
          description: updated thread
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Thread" }
        default: { $ref: "#/components/responses/Problem" }
  /inbox:
    get:
      tags: [inbox]
      operationId: listInbox
      description: >-
        the caller's own inbox only, newest-first (D-r per-actor view);
        read-state changes are not audited — the causing action is
      parameters:
        - { name: unread_only, in: query, schema: { type: boolean } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
      responses:
        "200":
          description: inbox items
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/InboxItem" } }
        default: { $ref: "#/components/responses/Problem" }
  /inbox/{id}/read:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [inbox]
      operationId: markInboxRead
      description: owner-only mark-read; absent or not-owned is 404 not_found — never 403, no existence leak (D-r)
      responses:
        "204":
          description: marked read (no body)
        default: { $ref: "#/components/responses/Problem" }
  /tasks/{id}/attachments:
    parameters: [{ $ref: "#/components/parameters/TaskId" }]
    get:
      tags: [attachments]
      operationId: listAttachments
      description: list attachment metadata for a task (404 if the task does not exist)
      responses:
        "200":
          description: metadata rows, oldest first
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Attachment" } }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [attachments]
      operationId: uploadAttachment
      description: >-
        raw application/octet-stream body; filename/content_type via querystring;
        size-capped (413 payload_too_large); content-addressed, re-upload dedupes (spec §6.6)
      parameters:
        - {
            name: filename,
            in: query,
            required: true,
            schema: { type: string, minLength: 1, maxLength: 240 },
          }
        - {
            name: content_type,
            in: query,
            schema: { type: string, maxLength: 120, default: application/octet-stream },
          }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: stored attachment metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Attachment" }
        default: { $ref: "#/components/responses/Problem" }
  /attachments/{id}/content:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    get:
      tags: [attachments]
      operationId: getAttachmentContent
      description: >-
        raw bytes; HTML/SVG-origin types are downgraded to application/octet-stream with
        attachment disposition and nosniff (spec §10)
      responses:
        "200":
          description: the stored bytes
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Problem" }
  /tasks/{id}/links:
    parameters: [{ $ref: "#/components/parameters/TaskId" }]
    get:
      tags: [links]
      operationId: listLinks
      description: list external links for a task (404 if the task does not exist)
      responses:
        "200":
          description: link rows, oldest first
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Link" } }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [links]
      operationId: addLink
      description: >-
        register an external handoff reference (D-t); insert-or-get on
        (task, kind, url) — re-posting the same triple returns the existing row
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, url]
              additionalProperties: false
              properties:
                kind: { type: string, enum: [pr, commit, doc, other] }
                url: { type: string, minLength: 8, maxLength: 2000 }
      responses:
        "201":
          description: the link row (existing or newly created)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Link" }
        default: { $ref: "#/components/responses/Problem" }
  /tasks/{id}/links/{linkId}:
    parameters:
      - { $ref: "#/components/parameters/TaskId" }
      - { name: linkId, in: path, required: true, schema: { type: string } }
    delete:
      tags: [links]
      operationId: removeLink
      description: remove a link; absent or belonging to another task is 404 not_found
      responses:
        "204":
          description: removed (no body)
        default: { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: agent tokens (and bootstrap admin) in Plan A; human cookie sessions arrive with OIDC in Plan E
  parameters:
    TaskId:
      name: id
      in: path
      required: true
      schema: { type: string }
  responses:
    Problem:
      description: domain rejection — stable machine code, branch on it (spec §11)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    TaskStatus:
      type: string
      enum: [backlog, todo, in_progress, in_review, done, canceled]
    TaskRecord:
      # The task row itself. Public endpoints may wrap it (split, context);
      # the flat Task DTO = TaskRecord + rollup counts.
      type: object
      # every property is always serialized: the DTO spreads the full sqlite row (dto.ts)
      required:
        [
          id,
          parent_id,
          title,
          description,
          acceptance_criteria,
          status,
          blocked_flag,
          assignee_id,
          position,
          created_by,
          created_at,
          updated_at,
          claim_token_id,
          claim_generation,
          last_heartbeat_at,
        ]
      properties:
        id: { type: string }
        parent_id: { type: ["string", "null"] }
        title: { type: string }
        description: { type: string, description: Markdown (spec §6.1) }
        acceptance_criteria: { type: string, description: Markdown (spec §6.1) }
        status: { $ref: "#/components/schemas/TaskStatus" }
        blocked_flag: { type: boolean }
        assignee_id: { type: ["string", "null"] }
        position: { type: number }
        created_by: { type: string }
        created_at: { type: string }
        updated_at: { type: string }
        claim_token_id: { type: ["string", "null"] }
        claim_generation: { type: integer }
        last_heartbeat_at: { type: ["string", "null"] }
    Task:
      description: flat task DTO — the row plus its rollup counts (toTaskDto)
      allOf:
        - $ref: "#/components/schemas/TaskRecord"
        - type: object
          properties:
            child_count: { type: integer }
            unmet_blockers: { type: integer }
    TaskWithCounts:
      # The un-DTO'd repository shape (ports.ts): row nested under `task`, counts beside it.
      # Served raw by split's parent (ora-20); task endpoints everywhere else use flat Task.
      type: object
      properties:
        task: { $ref: "#/components/schemas/TaskRecord" }
        child_count: { type: integer }
        unmet_blockers: { type: integer }
    ContextBundle:
      type: object
      properties:
        task: { $ref: "#/components/schemas/TaskRecord" }
        # ora-17: the bundle carries the rollup counts at top level, beside the seams
        child_count: { type: integer }
        unmet_blockers: { type: integer }
        ancestors:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              title: { type: string }
              status: { $ref: "#/components/schemas/TaskStatus" }
              acceptance_criteria: { type: string }
        blockers:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              title: { type: string }
              status: { $ref: "#/components/schemas/TaskStatus" }
        labels: { type: array, items: { $ref: "#/components/schemas/Label" } }
        open_questions:
          type: array
          description: open questions on the task (D-n/D-m); first-message text preview
          items:
            type: object
            properties:
              id: { type: string }
              state: { type: string, enum: [open, answered, resolved, wont_fix] }
              assignee_handle: { type: string }
              question: { type: string }
        links:
          type: array
          items: { $ref: "#/components/schemas/Link" }
        attachments:
          type: array
          items: { $ref: "#/components/schemas/Attachment" }
    Label:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        color: { type: string }
        created_at: { type: string }
    Actor:
      type: object
      properties:
        id: { type: string }
        kind: { type: string, enum: [human, agent] }
        handle: { type: string }
        display_name: { type: string }
        description: { type: string }
        created_at: { type: string }
    AuditEntry:
      type: object
      properties:
        id: { type: integer }
        actor_id: { type: ["string", "null"] }
        token_id: { type: ["string", "null"] }
        action: { type: string }
        entity_type: { type: string }
        entity_id: { type: string }
        before: {}
        after: {}
        reason: { type: ["string", "null"] }
        created_at: { type: string }
    Problem:
      type: object
      description: RFC 9457; `already_claimed` additionally carries holder_handle/holder_display_name
      required: [type, title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code:
          type: string
          enum:
            [
              not_found,
              forbidden,
              unauthenticated,
              invalid_request,
              internal_error,
              handle_taken,
              already_claimed,
              not_a_leaf,
              open_descendants,
              canceled_terminal,
              stale_lease,
              dependency_cycle,
              agent_close_forbidden,
              open_questions,
              threads_on_parent,
              question_transition,
              rate_limited,
              idempotency_in_flight,
              payload_too_large,
              unsupported_media_type,
            ]
        detail: { type: string }
    Thread:
      type: object
      description: thread row (ports.ts ThreadRecord); question fields NULL for notes (D-m)
      properties:
        id: { type: string }
        task_id: { type: string }
        kind: { type: string, enum: [note, question] }
        state:
          { type: ["string", "null"], enum: ["open", "answered", "resolved", "wont_fix", null] }
        assignee_id: { type: ["string", "null"] }
        answer_message_id: { type: ["string", "null"] }
        created_by: { type: string }
        created_at: { type: string }
        updated_at: { type: string }
    Message:
      type: object
      properties:
        id: { type: string }
        thread_id: { type: string }
        seq: { type: integer }
        author_id: { type: string }
        body: { type: string }
        created_at: { type: string }
    ThreadWithMessages:
      type: object
      description: thread + its messages ordered by seq (spec §6.5)
      properties:
        thread: { $ref: "#/components/schemas/Thread" }
        messages: { type: array, items: { $ref: "#/components/schemas/Message" } }
    InboxItem:
      type: object
      description: >-
        inbox entry (ports.ts InboxItemRecord); kind vocabulary mirrors domain
        INBOX_ITEM_KINDS (D-r) — claim_conflict stays deferred (Plan D-s)
      properties:
        id: { type: string }
        actor_id: { type: string }
        kind: { type: string, enum: [assigned, mentioned, question_assigned] }
        task_id: { type: string }
        thread_id: { type: ["string", "null"] }
        read: { type: boolean }
        created_at: { type: string }
    Link:
      type: object
      description: external link on a task (ports.ts LinkRecord, D-t)
      properties:
        id: { type: string }
        task_id: { type: string }
        kind: { type: string, enum: [pr, commit, doc, other] }
        url: { type: string }
        created_by: { type: string }
        created_at: { type: string }
    Attachment:
      type: object
      description: content-addressed attachment metadata (ports.ts AttachmentRecord, D-s); bytes of the stored blob
      properties:
        id: { type: string }
        task_id: { type: string }
        filename: { type: string }
        content_type: { type: string }
        sha256: { type: string }
        bytes: { type: integer }
        created_by: { type: string }
        created_at: { type: string }
